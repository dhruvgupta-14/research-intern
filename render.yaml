# Render Blueprint for the dashboard API.
#
# Optional: only read when you create the service via "New > Blueprint". If
# you create the Web Service by hand, use the same settings from the
# dashboard - this file then serves as the record of how it is configured,
# which is otherwise nowhere in the repo.
#
# Root Directory is deliberately NOT set. Render's rootDir changes where
# commands run AND narrows auto-deploy to that folder - so with
# rootDir: benchmark-backend, pushing new labelled data under MULTILINGUAL/
# would not redeploy, and the dashboard would keep serving stale numbers.
# Running from the repo root instead means every push redeploys, which is
# what we want: the corpus is the thing that changes.
#
# CORPUS_ROOT still resolves correctly either way - the backend derives it
# from __dirname, not from the working directory.

services:
  - type: web
    name: benchmark-backend
    runtime: node
    plan: free
    buildCommand: cd benchmark-backend && npm install
    startCommand: cd benchmark-backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"

      # Secrets - set these in the Render dashboard, not here.
      - key: JWT_SECRET
        sync: false
      - key: USER1_NAME
        sync: false
      - key: USER1_PASS
        sync: false
      - key: USER2_NAME
        sync: false
      - key: USER2_PASS
        sync: false

      # The Vercel production URL, comma-separated if you want more than one.
      # Set after the frontend is deployed, then redeploy this service.
      - key: FRONTEND_ORIGIN
        sync: false

      - key: JWT_EXPIRES_IN
        value: 8h
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        value: research-intern
      - key: GITHUB_BRANCH
        value: main
